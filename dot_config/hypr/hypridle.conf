general {
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 120
    condition_cmd = busctl --system --timeout=1s get-property org.freedesktop.UPower /org/freedesktop/UPower org.freedesktop.UPower OnBattery | grep -qx 'b true'
    on-timeout = /usr/bin/python ~/.config/hypr/scripts/battery-refresh.py idle
    on-resume = /usr/bin/python ~/.config/hypr/scripts/battery-refresh.py resume
}

listener {
    timeout = 180
    condition_cmd = busctl --system --timeout=1s get-property org.freedesktop.UPower /org/freedesktop/UPower org.freedesktop.UPower OnBattery | grep -qx 'b true'
    on-timeout = loginctl lock-session
}

listener {
    timeout = 195
    condition_cmd = busctl --system --timeout=1s get-property org.freedesktop.UPower /org/freedesktop/UPower org.freedesktop.UPower OnBattery | grep -qx 'b true'
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# The longer timeouts also cover a power change during an idle period.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
